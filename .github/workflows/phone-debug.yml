name: Phone debug validation
on:
  workflow_dispatch:
  push:
    branches: [fix/network-address-saving]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true
      - run: flutter pub get
      - name: Format and retain patch
        run: |
          dart format lib/components/NetworkSettingsScreen lib/screens/network_settings_screen.dart test/network_settings_test.dart
          git diff > formatting.patch
      - uses: actions/upload-artifact@v6
        with:
          name: formatting-patch
          path: formatting.patch
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/components/NetworkSettingsScreen lib/screens/network_settings_screen.dart test/network_settings_test.dart
      - run: flutter test
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v6
        with:
          name: phone-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          compression-level: 0
